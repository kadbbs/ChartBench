<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartBench Market Chart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=asset_versions.styles_css) }}" />
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="eyebrow">Market Chart</div>
        <h1 id="page-title">ChartBench 行情理解面板</h1>
        <div class="brand-subline">
          <span id="symbol-name">--</span>
          <span class="brand-dot">•</span>
          <span id="duration-name">--</span>
        </div>
      </div>
      <div class="panel">
        <div class="panel-label">Market</div>
        <div class="control-grid">
          <label class="control-field">
            <span>Provider</span>
            <select id="provider-select"></select>
          </label>
          <label class="control-field">
            <span>Symbol</span>
            <div class="symbol-mode-bar">
              <button id="watchlist-tab-favorites" class="symbol-mode-btn" type="button">自选</button>
              <button id="watchlist-tab-all" class="symbol-mode-btn is-active" type="button">全部</button>
              <button id="watchlist-add-current" class="symbol-mode-action" type="button">加入</button>
              <button id="watchlist-remove-current" class="symbol-mode-action" type="button">移除</button>
            </div>
            <select id="symbol-select"></select>
          </label>
          <label class="control-field">
            <span>Chart Type</span>
            <select id="bar-mode-select"></select>
          </label>
          <label class="control-field">
            <span>Timeframe</span>
            <select id="duration-select"></select>
          </label>
          <label class="control-field">
            <span id="bar-size-label">Price Tick</span>
            <input id="range-ticks-input" type="number" min="1" step="1" />
          </label>
          <label class="control-field">
            <span id="history-size-label">Bars</span>
            <input id="brick-length-input" type="number" min="100" step="100" />
          </label>
        </div>
        <div class="field"><span>Provider</span><strong id="provider-name">--</strong></div>
        <div class="field"><span>Last</span><strong id="last-price">--</strong></div>
        <div class="field"><span>Update</span><strong id="last-update">--</strong></div>
        <div class="field"><span>Cursor</span><strong id="cursor-time">--</strong></div>
        <div id="provider-hint" class="subhint">--</div>
        <div id="contract-detail-card" class="detail-card">
          <div class="detail-card-title">Contract Detail</div>
          <div class="detail-grid">
            <div class="detail-item">
              <span>Exchange</span>
              <strong id="detail-first-tick">--</strong>
            </div>
            <div class="detail-item">
              <span>Type</span>
              <strong id="detail-last-tick">--</strong>
            </div>
            <div class="detail-item">
              <span>Name</span>
              <strong id="detail-tick-count">--</strong>
            </div>
            <div class="detail-item">
              <span>Tick Size</span>
              <strong id="detail-price-tick">--</strong>
            </div>
            <div class="detail-item">
              <span>Symbol</span>
              <strong id="detail-contract-month">--</strong>
            </div>
            <div class="detail-item">
              <span>Multiplier</span>
              <strong id="detail-volume-multiple">--</strong>
            </div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-label">Studies</div>
        <form id="indicator-form" class="indicator-list"></form>
        <div class="hint">当前只保留 ATR Bands、MACD、STC 和多空线。</div>
      </div>
      <div id="error-message" class="error"></div>
    </aside>
    <main class="main">
      <section class="page-header">
        <div class="meta-line">
          <span class="meta-item"><strong id="meta-contract">SHFE.cu2607</strong></span>
          <span class="meta-item">实时行情</span>
          <span class="meta-item">主图 + 技术指标</span>
          <span class="meta-item" id="meta-status">Realtime market bars</span>
        </div>
      </section>
      <div class="chart-card">
        <div id="chart-stack" class="chart-stack"></div>
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', filename='app.js', v=asset_versions.app_js) }}"></script>
</body>
</html>
