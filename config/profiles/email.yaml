# =============================================================================
# 仅邮件观察方案
# -----------------------------------------------------------------------------
# 用途：
# - 只观察策略信号。
# - 写日志/发邮件。
# - 不构造 Bitget 下单请求。
# - 不会真实下单，也不会自动从现货划转。
#
# 常用命令：
# ./myvenv/bin/python run_live_trading.py --profile email --continuous
#
# 可改项：
# - 如果你只想观察不同币种/周期，优先用命令行参数：
#   --symbol ETHUSDT --duration 300
# - 策略参数建议改 config/defaults.yaml，避免三个 profile 不一致。
# =============================================================================

# 运行模式：email=仅邮件/日志观察。
LIVE_TRADING_MODE: email

# 实盘观察链路固定使用 Bitget USDT-FUTURES，避免继承其他机器的默认 provider。
LIVE_TRADING_PROVIDER: bitget
LIVE_TRADING_PRODUCT_TYPE: USDT-FUTURES
TQ_DEFAULT_SYMBOL: BTCUSDT

# 观察模式不需要也不应该自动划转。
LIVE_TRADING_AUTO_TRANSFER_FROM_SPOT: false
