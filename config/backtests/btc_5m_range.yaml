# =============================================================================
# 回测配置：BTCUSDT 5m 指定时间区间
# -----------------------------------------------------------------------------
# 用途：
# - 修改 start_time / end_time 后直接运行。
# - 未带时区的时间按北京时间解析。
#
# 常用命令：
# ./myvenv/bin/python run_backtest.py --profile btc_5m_range
#
# 注意：
# - 5m 长历史会使用 Bitget history-candles 接口，首次拉取一年会比较慢。
# - 回测仓位固定在代码中：1000U 保证金、10倍杠杆。
# =============================================================================

symbol: BTCUSDT
duration: 300
start_time: "2026-05-31 00:00:00"
end_time: "2026-06-06 00:00:00"
strategy: live_decision
product_type: USDT-FUTURES
kline_type: MARKET
initial_equity: 1000
# 10x 下单边名义费率 0.00023，开平仓合计约为保证金的 0.46%。
fee_rate: 0.00023
slippage_rate: 0
warmup_bars: 80
output_dir: backtest_outputs/btc_5m_range
