# BTCUSDT 5m 三年缓存回测：1D 主趋势 + 1H Hull/STC 同向重复开仓。
# 首次开仓只要求 1D Hull/STC 同向；风控平仓后，同一 1D Hull 颜色段内的
# 后续低周期信号需要已收完的 1H Hull 与 STC 同向，才允许再次开仓。

