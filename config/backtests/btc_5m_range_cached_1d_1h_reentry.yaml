signal_mode: any
use_closed_bar: true
htf_hull_filter_enabled: true
htf_hull_duration_seconds: 86400
atr_period: 14
stop_atr_multiplier: 2
tp1_r_multiple: 1
tp1_size_ratio: 0.5
tp2_r_multiple: 1.5

initial_equity: 20000
margin_ratio_per_trade: 0
fee_rate: 0.00023
slippage_rate: 0
