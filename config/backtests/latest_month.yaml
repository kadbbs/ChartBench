# =============================================================================
# 回测配置：最近一段数据
# -----------------------------------------------------------------------------
# 用途：
# - 少写命令行参数。
# - 默认按 BTCUSDT、5m、live_decision 策略回测。
# - 不写 start_time/end_time 时，会按 length 向前取最近 N 根 K 线。
#
# 常用命令：
# ./myvenv/bin/python run_backtest.py --profile latest_month
#
# 回测总资金 20000U，单笔固定使用 1000U 保证金，10倍杠杆。
# =============================================================================

symbol: BTCUSDT
provider: bitget
duration: 300
length: 8657
strategy: live_decision
product_type: USDT-FUTURES
kline_type: MARKET

# 固定信号参数；该 profile 的行情窗口仍按运行时最近 length 根滚动，
# 每次实际使用的数据起止时间会写入 report.json 的 resolved_data_window。
signal_strategy: stc_extreme_contrarian
signal_mode: any
use_closed_bar: true
htf_hull_filter_enabled: true
htf_hull_duration_seconds: 14400
atr_period: 14
stop_atr_multiplier: 2
tp1_r_multiple: 1
tp1_size_ratio: 0.5
tp2_r_multiple: 1.5

initial_equity: 20000
margin_ratio_per_trade: 0
# 10x 下单边名义费率 0.00023，开平仓合计约为保证金的 0.46%。
fee_rate: 0.00023
slippage_rate: 0
warmup_bars: 80
risk_exits_enabled: true
startup_check_bars_5m: 24
startup_max_favorable_points: 300
startup_current_points: -150
disaster_stop_points: -1800
breakeven_trigger_points: 800
breakeven_stop_points: 100
trailing_trigger_1_points: 2000
trailing_protect_1_ratio: 0.4
trailing_trigger_2_points: 4000
trailing_protect_2_ratio: 0.5
trailing_trigger_3_points: 8000
trailing_protect_3_ratio: 0.6
output_dir: backtest_outputs/latest
