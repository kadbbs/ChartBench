# BTCUSDT 5m / 1D Hull+STC 无风控信号路径研究。
#
# 基准语义：
# - 使用已收完的 1D Hull 与 STC 同向过滤 5m 信号。
# - 5m 信号收线确认，下一根 5m 开盘执行。
# - 持仓直到符合日线方向的有效反向 5m 信号；中间没有任何风险退出。
# - 同向有效信号只记录，供后续再入场研究使用。

symbol: BTCUSDT
provider: bitget
duration: 300
start_time: "2023-03-31 00:00:00"
end_time: "2026-06-20 00:00:00"
strategy: live_decision
product_type: USDT-FUTURES
kline_type: MARKET

signal_strategy: stc_extreme_contrarian
signal_mode: any
use_closed_bar: true
htf_hull_filter_enabled: true
htf_hull_duration_seconds: 86400
atr_period: 14

# 固定所有会改变 5m/1D 信号的指标参数。
indicator.merged_dkx_hull_ut.hull_length: 55
indicator.merged_dkx_hull_ut.hull_length_mult: 1
indicator.merged_dkx_hull_ut.hull_variation: Hma
indicator.merged_dkx_hull_ut.ut_atr_period: 6
indicator.merged_dkx_hull_ut.ut_sensitivity: 2
indicator.merged_dkx_hull_ut.ut_use_heikin_ashi: false
indicator.stc.length: 80
indicator.stc.fast_length: 27
indicator.stc.slow_length: 50
indicator.stc.factor: 0.5

initial_equity: 20000
margin_amount: 1000
margin_ratio_per_trade: 0
leverage: 10
fee_rate: 0.00023
slippage_rate: 0
warmup_bars: 80
risk_exits_enabled: false
# 以下参数为 profile 可复现性保留；基准路径明确不会读取它们。
startup_check_bars_5m: 24
startup_max_favorable_points: 300
startup_current_points: -300
disaster_stop_points: -1800
breakeven_trigger_points: 800
breakeven_stop_points: 100
trailing_trigger_1_points: 2000
trailing_protect_1_ratio: 0.4
trailing_trigger_2_points: 4000
trailing_protect_2_ratio: 0.5
trailing_trigger_3_points: 8000
trailing_protect_3_ratio: 0.6

cache_enabled: true
cache_dir: data_cache/backtest_klines
output_dir: backtest_outputs/btc_5m_signal_path
