# =============================================================================
# 全局默认配置
# -----------------------------------------------------------------------------
# 这里放“不含密钥”的项目默认值。
#
# 生效优先级：
# config/defaults.yaml < config/profiles/*.yaml < .env < shell 环境变量 < 命令行参数
#
# 建议：
# - 这里放大多数场景都一样的默认值。
# - 每个运行方案的差异放到 config/profiles/*.yaml。
# - API Key、Secret、邮箱收件人等私人信息继续放 .env。
# =============================================================================


# ===== 图表 / 行情默认参数 =====

# 全局默认 provider 仍给实盘/回测使用；图表可以用下面的 TQ_CHART_* 单独覆盖。
TQ_DEFAULT_PROVIDER: binance

# 图表默认使用天勤量化行情，不影响实盘/回测入口。
TQ_CHART_DEFAULT_PROVIDER: tianqin
TQ_CHART_DEFAULT_SYMBOL: KQ.m@SHFE.cu

# 默认交易合约。实盘/回测默认使用 USDT 合约代码格式里的 BTCUSDT。
TQ_DEFAULT_SYMBOL: BTCUSDT

# 默认 K 线周期，单位秒。常用：180=3m，300=5m，900=15m，3600=1h。
TQ_DEFAULT_DURATION_SECONDS: 300

# 默认拉取 K 线数量。越大启动越慢，但指标历史更充足。
TQ_DEFAULT_DATA_LENGTH: 800

# 后端刷新等待间隔，单位毫秒。
TQ_DEFAULT_REFRESH_MS: 200

# Web 服务监听地址和端口。
TQ_DEFAULT_HOST: 0.0.0.0
TQ_DEFAULT_PORT: 8050

# 当前 Tianqin/Binance/Bitget 数据源只支持 time。
TQ_DEFAULT_BAR_MODE: time

# Range/Renko 预留参数；当前 time 模式不会用。
TQ_DEFAULT_RANGE_TICKS: 10
TQ_DEFAULT_BRICK_LENGTH: 10000


# ===== 天勤量化图表行情参数 =====

# 天勤合约代码示例：KQ.m@SHFE.cu、KQ.m@DCE.m、KQ.m@CZCE.SR、SHFE.cu2607。
# TIANQIN_SYMBOLS 留空时先使用内置全市场主连品种表，再通过 TqSdk 自动追加未到期具体合约。
# 如果只想显示固定小列表，在 TIANQIN_SYMBOLS 写英文逗号分隔的合约代码。
# 合约目录是低频数据，默认成功后缓存 1 天，失败后 30 分钟内不重试。
# 私密账号密码请放 .env：TIANQIN_USERNAME / TIANQIN_PASSWORD。
TIANQIN_DEFAULT_SYMBOL: KQ.m@SHFE.cu
TIANQIN_SYMBOLS:
TIANQIN_INCLUDE_FUTURE_CONTRACTS: true
TIANQIN_CONTRACT_CATALOG_TTL_SECONDS: 86400
TIANQIN_CONTRACT_CATALOG_FAILURE_TTL_SECONDS: 1800
TIANQIN_CONTRACT_CATALOG_WAIT_SECONDS: 2
TIANQIN_CONTRACT_CATALOG_PROCESS_TIMEOUT_SECONDS: 45


# ===== Binance / Bitget 行情和产品参数 =====

# 当前项目默认跑 Binance USD-M 合约；Bitget USDT-FUTURES 也可用于图表/回测/实盘。
BINANCE_DEFAULT_PRODUCT_TYPE: UM-FUTURES
BINANCE_KLINE_TYPE: MARKET
BINANCE_FAPI_BASE: https://fapi.binance.com
BINANCE_WS_MARKET_BASE: wss://fstream.binance.com/market

BITGET_DEFAULT_PRODUCT_TYPE: USDT-FUTURES
BITGET_PRODUCT_TYPES: USDT-FUTURES
BITGET_KLINE_TYPE: MARKET


# ===== 实盘账户 / 合约参数 =====

# 实盘交易所 provider：binance / bitget。天勤仅用于图表模块。
LIVE_TRADING_PROVIDER: binance

# 产品类型会按 provider 自动修正：Binance 默认 UM-FUTURES，Bitget 默认 USDT-FUTURES。
LIVE_TRADING_PRODUCT_TYPE: UM-FUTURES

# 保证金币种。
LIVE_TRADING_MARGIN_COIN: USDT

# 持仓模式：one_way_mode=单向持仓；hedge_mode=双向持仓。
# Binance 使用 Hedge Mode 参数；Bitget 使用双向持仓 holdSide 参数。
LIVE_TRADING_POSITION_MODE: hedge_mode

# 保证金模式固定逐仓。当前实盘代码也会强制使用 isolated。
LIVE_TRADING_MARGIN_MODE: isolated

# 单笔使用多少 USDT 作为保证金。真实下单数量 = margin_amount * leverage / 开仓价。
LIVE_TRADING_MARGIN_AMOUNT: 5

# 杠杆倍数。当前实盘固定要求 10。
LIVE_TRADING_LEVERAGE: 10

# 合约账户 USDT 不足时，是否从现货账户自动划转。
# 真实启用需要对应交易所 API Key 开启划转权限。
LIVE_TRADING_AUTO_TRANSFER_FROM_SPOT: true

# 自动划转目标比例。1.1 表示合约账户至少保留 margin_amount * 1.1。
# 例如 margin_amount=5 时，合约账户不足 5.5U 就从现货补到 5.5U。
LIVE_TRADING_AUTO_TRANSFER_MULTIPLIER: 1.1

# 自动划转额外固定缓冲，单位 USDT。
# 默认 0，通常只调 multiplier 就够了；若设为 0.2，则目标为 margin_amount*multiplier+0.2。
LIVE_TRADING_AUTO_TRANSFER_BUFFER: 0


# ===== 开仓价格 / 精度 =====

# 开仓记录价格来源：mark_price=标记价；bar_close=信号 K 线收盘价。
LIVE_TRADING_ENTRY_PRICE_SOURCE: mark_price

# 价格小数位和数量小数位，需要按对应交易所合约规格确认。
LIVE_TRADING_PRICE_DECIMALS: 1
LIVE_TRADING_SIZE_DECIMALS: 4


# ===== 开仓时间过滤 =====

# false=不限制开仓时间；true=只允许在指定北京时间窗口内新开仓。
LIVE_TRADING_ENTRY_TIME_FILTER_ENABLED: false

# 开仓时间窗口，仅在 LIVE_TRADING_ENTRY_TIME_FILTER_ENABLED=true 时生效。
LIVE_TRADING_ENTRY_TIME_START: 20:00
LIVE_TRADING_ENTRY_TIME_END: 24:00


# ===== 策略 / 信号过滤 =====

# 高周期 Hull 趋势过滤。默认打开。
LIVE_TRADING_HTF_HULL_FILTER_ENABLED: true

# 高周期周期，单位秒。3600=1h。
LIVE_TRADING_HTF_HULL_DURATION_SECONDS: 14400

# 信号来源模式：
# any=Buy/买 或 Sell/卖 任一触发
# ut=只看 UT Bot 的 Buy/Sell
# dkx=只看 DKX 的 买/卖
# confirmed=UT 与 DKX 同向同时出现
LIVE_TRADING_SIGNAL_MODE: any

# 当前默认策略：
# 空单：Sell/卖 任一出现，且 STC > 75 并为红色
# 多单：Buy/买 任一出现，且 STC < 25 并为绿色
LIVE_TRADING_STRATEGY: stc_extreme_contrarian

# true=使用上一根已收完 K 线，减少未收线重绘影响。
LIVE_TRADING_USE_CLOSED_BAR: true


# ===== 本地仓位账本 / 交易所同步 =====

# 用本地 state 文件记录 open 仓位，避免同方向重复开仓。
LIVE_TRADING_LOCAL_POSITION_ENABLED: true

# 观察/邮件模式是否也记录虚拟 open 仓位。
LIVE_TRADING_LOCAL_POSITION_RECORD_OBSERVATION: true

# 真实模式下是否用交易所实际持仓同步本地账本。
LIVE_TRADING_POSITION_SYNC_ENABLED: true

# 持仓同步间隔，单位秒。
LIVE_TRADING_POSITION_SYNC_INTERVAL_SECONDS: 30

# true=只在真实交易模式同步，避免观察模式的虚拟仓位被空账号覆盖。
LIVE_TRADING_POSITION_SYNC_REAL_ONLY: true


# ===== 实盘持仓风控出场 =====

# false=不开启真实持仓风控平仓；true=常驻实盘进程会按同步间隔检查持仓并触发市价平仓。
# 该逻辑只在 LIVE_TRADING_MODE=live 时真正平仓，不影响 email / dry-run 观察链路。
LIVE_TRADING_RISK_EXITS_ENABLED: false

# 持仓风控检查间隔，单位秒。真实实盘建议 5-10 秒。
LIVE_TRADING_RISK_CHECK_INTERVAL_SECONDS: 5

# true=常驻实盘使用交易所 WebSocket ticker 驱动风控价格更新。
LIVE_TRADING_RISK_WEBSOCKET_TICKER_ENABLED: true

# WebSocket ticker 超过多少秒没更新就视为过期，并回退 REST ticker。
LIVE_TRADING_RISK_WEBSOCKET_TICKER_STALE_SECONDS: 5

# 同一仓位风控异常邮件冷却时间，单位秒，避免 API 异常时连续轰炸邮箱。
LIVE_TRADING_RISK_ERROR_EMAIL_COOLDOWN_SECONDS: 300

# 是否在开仓后立刻设置交易所服务器端灾难止损，作为程序断线/宕机时的兜底。
LIVE_TRADING_EXCHANGE_DISASTER_SL_ENABLED: true

# true=风控平仓优先只平本策略记录的 managed_size，避免手动同向加仓后被整体平掉。
LIVE_TRADING_RISK_CLOSE_MANAGED_SIZE_ONLY: true

# 风控检查价格来源。mark_price=标记价；last/market=最新成交价；index_price=指数价。
LIVE_TRADING_RISK_PRICE_SOURCE: mark_price

# 启动失败止损：开仓后第 N 根 5m K 线检查一次。
LIVE_TRADING_RISK_STARTUP_CHECK_BARS_5M: 24

# 启动失败止损条件 1：开仓以来最大浮盈小于该点数。
LIVE_TRADING_RISK_STARTUP_MAX_FAVORABLE_POINTS: 300

# 启动失败止损条件 2：检查时当前点数低于该点数。
LIVE_TRADING_RISK_STARTUP_CURRENT_POINTS: -120

# 灾难硬止损：最大浮亏或当前浮亏达到该点数时立即平仓。
LIVE_TRADING_RISK_DISASTER_STOP_POINTS: -1800

# 保本保护：最大浮盈达到 trigger 后，把保护线抬到 stop 点。
LIVE_TRADING_RISK_BREAKEVEN_TRIGGER_POINTS: 800
LIVE_TRADING_RISK_BREAKEVEN_STOP_POINTS: 100

# 移动保护：最大浮盈达到 trigger 后，保护最大浮盈的一定比例。
LIVE_TRADING_RISK_TRAILING_TRIGGER_1_POINTS: 2000
LIVE_TRADING_RISK_TRAILING_PROTECT_1_RATIO: 0.4
LIVE_TRADING_RISK_TRAILING_TRIGGER_2_POINTS: 4000
LIVE_TRADING_RISK_TRAILING_PROTECT_2_RATIO: 0.5
LIVE_TRADING_RISK_TRAILING_TRIGGER_3_POINTS: 8000
LIVE_TRADING_RISK_TRAILING_PROTECT_3_RATIO: 0.6


# ===== 邮件通知 =====

# 是否启用邮件通知。具体收件人放 .env 的 LIVE_TRADING_EMAIL_TO。
LIVE_TRADING_EMAIL_ENABLED: true

# 默认发件人。真实发信仍需要 .env 里的 RESEND_API_KEY。
RESEND_FROM_EMAIL: onboarding@resend.dev


# ===== 回测 R 倍数参数 =====

# 当前实盘不自动挂止盈止损；这些参数主要给回测报告/兼容旧逻辑保留。
LIVE_TRADING_ATR_PERIOD: 14
LIVE_TRADING_STOP_ATR_MULTIPLIER: 2
LIVE_TRADING_TP1_R_MULTIPLE: 1
LIVE_TRADING_TP1_SIZE_RATIO: 0.5
LIVE_TRADING_TP2_R_MULTIPLE: 1.5
